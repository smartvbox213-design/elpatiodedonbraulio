<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bowlby+One&family=Nunito:wght@600;800&display=swap">
<style>
:root{
  --panel:rgba(255,248,235,.92); --tinta:#2b1a10; --tenue:#6b4a33; --borde:#8b5a2b; --acento:#c2410c; --sombra:rgba(60,30,10,.35);
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--panel:rgba(30,20,14,.92);--tinta:#f6e8d6;--tenue:#caa985;--borde:#c08a52;--acento:#fb923c;--sombra:rgba(0,0,0,.6)}
}
:root[data-theme="dark"]{--panel:rgba(30,20,14,.92);--tinta:#f6e8d6;--tenue:#caa985;--borde:#c08a52;--acento:#fb923c;--sombra:rgba(0,0,0,.6)}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:#9fd0f0;font-family:'Nunito',system-ui,sans-serif;color:var(--tinta);overflow:hidden}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
#c:active{cursor:grabbing}
header{position:fixed;left:14px;top:calc(12px + env(safe-area-inset-top,0px));background:var(--panel);border:2px solid var(--borde);border-radius:6px;padding:8px 14px;box-shadow:4px 4px 0 var(--sombra)}
h1{font-family:'Bowlby One','Impact',sans-serif;font-weight:400;font-size:clamp(18px,3.2vw,28px);margin:0;line-height:1.1;letter-spacing:.01em}
header p{margin:2px 0 0;font-size:13px;color:var(--tenue);font-weight:600}
nav{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));display:flex;gap:8px;flex-wrap:wrap;justify-content:center;width:calc(100% - 24px);max-width:640px}
button{font:800 15px 'Nunito',system-ui,sans-serif;color:var(--tinta);background:var(--panel);border:2px solid var(--borde);border-radius:6px;padding:10px 16px;cursor:pointer;box-shadow:3px 3px 0 var(--sombra);min-height:44px}
button:hover{transform:translate(-1px,-1px)}
button[aria-pressed="true"]{background:var(--acento);color:#fff;border-color:var(--tinta)}
button:focus-visible{outline:3px solid var(--tinta);outline-offset:2px}
#globo{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));width:min(92%,520px);background:var(--panel);border:2px solid var(--borde);border-radius:14px;padding:12px 16px;box-shadow:4px 4px 0 var(--sombra);display:none}
#globo.on{display:block}
#globo b{font-family:'Bowlby One','Impact',sans-serif;font-weight:400;font-size:16px;color:var(--acento)}
#globo small{display:block;color:var(--tenue);font-weight:600;margin-bottom:4px}
#globo q{display:block;font-size:17px;line-height:1.35;font-weight:800;quotes:none}
#cargando{position:fixed;inset:0;display:grid;place-items:center;background:#9fd0f0;font-family:'Bowlby One',sans-serif;font-size:22px;color:#2b1a10}
@media (prefers-reduced-motion:reduce){button:hover{transform:none}}
</style>

/* ---- Patio formoseño (adaptado de tu escenarios.js) ---- */
function crearPatioFormoseno(scene){
  var M=function(c){return new THREE.MeshLambertMaterial({color:c})};
  // 1. Suelo de tierra colorada compacta
  var suelo=new THREE.Mesh(new THREE.PlaneGeometry(80,80),M(0x9a5a35));
  suelo.rotation.x=-Math.PI/2; suelo.receiveShadow=true; scene.add(suelo);
  // 2. Casa de ladrillo visto con techo de chapa
  var casa=new THREE.Mesh(new THREE.BoxGeometry(12,5,8),M(0xb22222));
  casa.position.set(-5,2.5,-10); casa.castShadow=true; casa.receiveShadow=true; scene.add(casa);
  var techo=new THREE.Mesh(new THREE.BoxGeometry(13.4,0.4,9.4),M(0x9aa3a8));
  techo.position.set(-5,5.2,-10); techo.castShadow=true; scene.add(techo);
  var puerta=new THREE.Mesh(new THREE.BoxGeometry(1.8,3.2,0.2),M(0x6b4423));
  puerta.position.set(-5,1.6,-5.95); scene.add(puerta);
  [-8.6,-1.4].forEach(function(x){var v=new THREE.Mesh(new THREE.BoxGeometry(1.6,1.6,0.2),M(0x3b2a1e));v.position.set(x,2.6,-5.95);scene.add(v)});
  // 3. Algarrobo: tronco y copa de varias esferas, alta para dejar lugar a los animales
  var marron=M(0x4a2e1b);
  var tronco=new THREE.Mesh(new THREE.CylinderGeometry(0.6,0.8,6,8),marron);
  tronco.position.set(6,3,-2); tronco.castShadow=true; scene.add(tronco);
  var verde=M(0x2e8b2e), verde2=M(0x3a9a3a);
  [[6,7.4,-3.4,2.8,verde],[3.4,6.9,-4.2,2.1,verde2],[8.8,7.0,-4,2.2,verde2],[6,8.6,-2.6,2.2,verde]].forEach(function(s){
    var m=new THREE.Mesh(new THREE.SphereGeometry(s[3],10,10),s[4]); m.position.set(s[0],s[1],s[2]); m.castShadow=true; scene.add(m);
  });
  // Ramas bajas: una para Paco y otra para Cacho
  var rama=new THREE.Mesh(new THREE.CylinderGeometry(0.2,0.2,4,8),marron);
  rama.rotation.z=Math.PI/2; rama.position.set(4,4.5,-2); scene.add(rama);
  var rama2=new THREE.Mesh(new THREE.CylinderGeometry(0.16,0.16,3,8),marron);
  rama2.rotation.z=Math.PI/2; rama2.position.set(7.8,5.1,-1.4); scene.add(rama2);
  // 4. Mesa rústica para el tereré (tapa + patas)
  var mt=M(0x5c4033);
  var tapa=new THREE.Mesh(new THREE.BoxGeometry(3,0.15,2),mt); tapa.position.set(1,1.4,1); tapa.castShadow=true; scene.add(tapa);
  [[-0.6,-0.8],[0.6,-0.8],[-0.6,0.8],[0.6,0.8]].forEach(function(p){
    var pa=new THREE.Mesh(new THREE.BoxGeometry(0.15,1.4,0.15),mt); pa.position.set(1+p[0]*2.2,0.7,1+p[1]); scene.add(pa);
  });
  // Termo y mates sobre la mesa
  var termo=new THREE.Mesh(new THREE.CylinderGeometry(0.16,0.16,0.6,12),M(0x7a3b1d)); termo.position.set(1.2,1.77,0.9); scene.add(termo);
  [[-0.3,1.05],[0.2,1.2]].forEach(function(p){var g=new THREE.Mesh(new THREE.CylinderGeometry(0.16,0.12,0.25,12),M(0x5a3a22));g.position.set(1+p[0],1.58,p[1]);scene.add(g)});
  // Reposeras de colores
  [[-2.2,3.2,0.35],[4.3,3.0,-0.3]].forEach(function(r,i){
    var cols=[0xe4572e,0x29a3a3,0xf2c14e,0x6a4c93];
    for(var k=0;k<4;k++){
      var asiento=new THREE.Mesh(new THREE.BoxGeometry(0.28,0.08,1.0),M(cols[(k+i)%4]));
      asiento.position.set(r[0]-0.42+k*0.28,0.55,r[1]); asiento.rotation.y=r[2]; scene.add(asiento);
      var resp=new THREE.Mesh(new THREE.BoxGeometry(0.28,1.0,0.08),M(cols[(k+i+1)%4]));
      resp.position.set(r[0]-0.42+k*0.28,1.0,r[1]-0.5); resp.rotation.y=r[2]; resp.rotation.x=-0.25; scene.add(resp);
    }
  });
  // Matas de pasto y un par de arbustos al fondo
  for(var i=0;i<26;i++){
    var a=new THREE.Mesh(new THREE.ConeGeometry(0.25,0.7,5),M(0x7a9a3a));
    a.position.set(-18+Math.random()*40,0.35,-3-Math.random()*6); scene.add(a);
  }
  [[-15,-8],[12,-9],[16,-4],[-14,-3]].forEach(function(p){
    var b=new THREE.Mesh(new THREE.SphereGeometry(1.6,8,8),M(0x4c7a3a)); b.position.set(p[0],1.2,p[1]); scene.add(b);
  });
  // Luz: sol fuerte de siesta y ambiente
  var sol=new THREE.DirectionalLight(0xfff3dc,0.8);
  sol.position.set(10,20,12); sol.castShadow=true;
  sol.shadow.camera.left=-20; sol.shadow.camera.right=20; sol.shadow.camera.top=20; sol.shadow.camera.bottom=-20;
  sol.shadow.mapSize.set(1024,1024);
  scene.add(sol);
  scene.add(new THREE.AmbientLight(0xffffff,0.5));
}
crearPatioFormoseno(scene);

/* ---- Personajes (sprites con tus ilustraciones) ---- */
var pers={}, clic=[];
var POS={ braulio:{x:-1.1,y:0,z:1.6,alto:3.1}, paco:{x:4.2,y:4.5,z:-1.2,alto:1.35}, cacho:{x:7.6,y:5.1,z:-0.7,alto:2.1} };
var pend=3;
Object.keys(SPR).forEach(function(k){
  new THREE.TextureLoader().load(SPR[k].src,function(tex){
    var p=POS[k], asp=SPR[k].w/SPR[k].h;
    var mat=new THREE.SpriteMaterial({map:tex,transparent:true,alphaTest:0.04});
    var s=new THREE.Sprite(mat);
    s.scale.set(p.alto*asp,p.alto,1);
    s.center.set(0.5,0);
    s.position.set(p.x,p.y,p.z);
    s.userData.k=k; scene.add(s); pers[k]=s; clic.push(s);
    if(k==='braulio'){ // sombra de contacto
      var sh=new THREE.Mesh(new THREE.CircleGeometry(0.9,20),new THREE.MeshBasicMaterial({color:0x000000,transparent:true,opacity:0.25}));
      sh.rotation.x=-Math.PI/2; sh.position.set(p.x,0.02,p.z); scene.add(sh);
    }
    if(--pend===0) document.getElementById('cargando').style.display='none';
  });
});

/* ---- Cámara: órbita con arrastre + enfoque a cada personaje ---- */
var VISTAS={
  general:{t:[2,3.2,-1],d:15,az:0,el:0.2},
  braulio:{t:[-0.3,1.8,1.2],d:7,az:0,el:0.12},
  paco:{t:[4.2,5.1,-1.2],d:5.2,az:0.08,el:0.05},
  cacho:{t:[7.6,6.1,-0.7],d:6.2,az:-0.1,el:0.05}
};
var cur={t:[2,3.2,-1],d:15,az:0,el:0.2}, dst={t:[2,3.2,-1],d:15,az:0,el:0.2}, vistaK='general';
function aplicar(){
  var x=cur.t[0]+cur.d*Math.sin(cur.az)*Math.cos(cur.el);
  var y=cur.t[1]+cur.d*Math.sin(cur.el);
  var z=cur.t[2]+cur.d*Math.cos(cur.az)*Math.cos(cur.el);
  camera.position.set(x,Math.max(y,0.6),z); camera.lookAt(cur.t[0],cur.t[1],cur.t[2]);
}
var reducir=window.matchMedia&&matchMedia('(prefers-reduced-motion:reduce)').matches;
function enfocar(k){
  vistaK=k; var v=VISTAS[k];
  dst={t:v.t.slice(),d:v.d,az:v.az,el:v.el};
  if(reducir){cur={t:dst.t.slice(),d:dst.d,az:dst.az,el:dst.el};}
  document.querySelectorAll('nav button').forEach(function(b){b.setAttribute('aria-pressed',String(b.dataset.k===k))});
  var g=document.getElementById('globo');
  if(FICHA[k]){document.getElementById('gN').textContent=FICHA[k].n;document.getElementById('gR').textContent=FICHA[k].r;document.getElementById('gF').textContent=FICHA[k].f;g.classList.add('on');}
  else g.classList.remove('on');
}
document.querySelectorAll('nav button').forEach(function(b){b.addEventListener('click',function(){enfocar(b.dataset.k)})});

var arr=false,lx=0,ly=0,moved=0;
canvas.addEventListener('pointerdown',function(e){arr=true;lx=e.clientX;ly=e.clientY;moved=0;canvas.setPointerCapture(e.pointerId)});
canvas.addEventListener('pointermove',function(e){
  if(!arr)return; var dx=e.clientX-lx, dy=e.clientY-ly; lx=e.clientX; ly=e.clientY; moved+=Math.abs(dx)+Math.abs(dy);
  dst.az=Math.max(-1.0,Math.min(1.0,dst.az-dx*0.005));
  dst.el=Math.max(0.02,Math.min(0.7,dst.el+dy*0.004));
});
canvas.addEventListener('pointerup',function(e){
  arr=false;
  if(moved<6){ // clic: ¿tocó un personaje?
    var r=canvas.getBoundingClientRect(), m=new THREE.Vector2(((e.clientX-r.left)/r.width)*2-1,-((e.clientY-r.top)/r.height)*2+1);
    var rc=new THREE.Raycaster(); rc.setFromCamera(m,camera);
    var h=rc.intersectObjects(clic); if(h.length) enfocar(h[0].object.userData.k);
  }
});
canvas.addEventListener('wheel',function(e){e.preventDefault();dst.d=Math.max(3.5,Math.min(24,dst.d+e.deltaY*0.01))},{passive:false});

function ajustar(){
  var w=window.innerWidth,h=window.innerHeight;
  renderer.setSize(w,h,false); camera.aspect=w/h; camera.updateProjectionMatrix();
}
window.addEventListener('resize',ajustar); ajustar();

var t0=performance.now();
function loop(now){
  requestAnimationFrame(loop);
  var k=reducir?1:0.08;
  for(var i=0;i<3;i++) cur.t[i]+=(dst.t[i]-cur.t[i])*k;
  cur.d+=(dst.d-cur.d)*k; cur.az+=(dst.az-cur.az)*k; cur.el+=(dst.el-cur.el)*k;
  aplicar();
  if(!reducir){ // leve vaivén de Cacho colgado
    var s=(now-t0)/1000;
    if(pers.cacho) pers.cacho.position.y=POS.cacho.y+Math.sin(s*1.6)*0.06;
    if(pers.paco) pers.paco.position.y=POS.paco.y+Math.sin(s*2.4+1)*0.02;
  }
  renderer.render(scene,camera);
}
aplicar(); requestAnimationFrame(loop);
})();
</script>
